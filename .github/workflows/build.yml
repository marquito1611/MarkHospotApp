name: Build MarkHotspot (Windows x64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore MarkHotspot.sln
      - name: Build Release x64
        run: dotnet build MarkHotspot.sln --configuration Release -p:Platform=x64 --no-restore
      - name: Publish standalone EXE
        run: dotnet publish src/MarkHotspot.App/MarkHotspot.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/MarkHotspot
      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = Join-Path "artifacts/MarkHotspot" "MarkHotspot.exe"
          if (!(Test-Path $exe)) {
            Get-ChildItem "artifacts/MarkHotspot" -Recurse | Select-Object FullName
            throw "No se encontró MarkHotspot.exe en la publicación."
          }
          Get-Item $exe | Select-Object FullName, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkHotspot-Windows-x64
          path: artifacts/MarkHotspot/
          if-no-files-found: error
          retention-days: 30
