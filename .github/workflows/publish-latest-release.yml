name: Publish Windows build to Releases

on:
  workflow_run:
    workflows: ["Windows x64 build"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from completed build
        uses: actions/download-artifact@v4
        with:
          name: MarkHotspot-win-x64
          path: ./artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Find executable
        id: exe
        shell: bash
        run: |
          exe=$(find ./artifact -type f -iname '*.exe' -print -quit)
          if [ -z "$exe" ]; then
            echo 'No .exe found in the downloaded workflow artifact.' >&2
            find ./artifact -maxdepth 3 -type f -print
            exit 1
          fi
          echo "path=$exe" >> "$GITHUB_OUTPUT"
      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.event.workflow_run.run_number }}
          name: MarkHotspot Windows x64 — Build ${{ github.event.workflow_run.run_number }}
          body: |
            Automatically published from successful Windows x64 build #${{ github.event.workflow_run.run_number }}.
            Commit: ${{ github.event.workflow_run.head_sha }}
          files: ${{ steps.exe.outputs.path }}
          fail_on_unmatched_files: true
