name: Windows x64 build

on:
  push:
    branches: [main]
    paths:
      - '**.cs'
      - '**.xaml'
      - '**.csproj'
      - '**.sln'
      - '**.manifest'
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore MarkHotspot.sln
      - name: Build Release x64
        run: dotnet build MarkHotspot.sln --configuration Release --no-restore -p:Platform=x64 -p:Version=1.0.0.${{ github.run_number }}
      - name: Publish self-contained x64
        run: dotnet publish src/MarkHotspot.App/MarkHotspot.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=1.0.0.${{ github.run_number }} --output artifacts/MarkHotspot
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkHotspot-win-x64
          path: artifacts/MarkHotspot/
          if-no-files-found: error
          retention-days: 14
