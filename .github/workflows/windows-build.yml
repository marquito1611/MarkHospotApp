name: Windows x64 build and release

on:
  push:
    branches: [main]
    paths:
      - '**.cs'
      - '**.xaml'
      - '**.csproj'
      - '**.sln'
      - '**.manifest'
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: markhotspot-public-release-main
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip superseded commits
        id: guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $mainSha = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha
          if ($mainSha -ne "${{ github.sha }}") {
            "current=false" >> $env:GITHUB_OUTPUT
            Write-Host "Este commit fue superado por uno más reciente; no se publicará una versión duplicada."
          } else {
            "current=true" >> $env:GITHUB_OUTPUT
          }

      - name: Calculate next public version
        if: steps.guard.outputs.current == 'true'
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $latestTag = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or $latestTag -notmatch '^v(\d+)\.(\d+)\.(\d+)-Public_Release$') {
            throw "No se pudo leer la última versión estable con formato vX.Y.Z-Public_Release."
          }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3] + 1
          $tag = "v$major.$minor.$patch-Public_Release"
          $version = "$major.$minor.$patch"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "Versión calculada: $tag"

      - name: Setup .NET
        if: steps.guard.outputs.current == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        if: steps.guard.outputs.current == 'true'
        run: dotnet restore MarkHotspot.sln

      - name: Build Release x64
        if: steps.guard.outputs.current == 'true'
        run: dotnet build MarkHotspot.sln --configuration Release --no-restore -p:Platform=x64 -p:Version=${{ steps.version.outputs.version }}

      - name: Publish self-contained x64
        if: steps.guard.outputs.current == 'true'
        run: dotnet publish src/MarkHotspot.App/MarkHotspot.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ steps.version.outputs.version }} --output artifacts/MarkHotspot

      - name: Sign MarkHotspot as MarkSoft
        if: steps.guard.outputs.current == 'true'
        shell: pwsh
        env:
          MARKSOFT_SIGNING_CERT_BASE64: ${{ secrets.MARKSOFT_SIGNING_CERT_BASE64 }}
          MARKSOFT_SIGNING_CERT_PASSWORD: ${{ secrets.MARKSOFT_SIGNING_CERT_PASSWORD }}
        run: |
          $exe = (Resolve-Path "artifacts/MarkHotspot/MarkHotspot.exe").Path
          $sdkPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $signTool = Get-ChildItem $sdkPath -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw "No se encontró SignTool del Windows SDK." }

          if ($env:MARKSOFT_SIGNING_CERT_BASE64 -and $env:MARKSOFT_SIGNING_CERT_PASSWORD) {
            $pfx = Join-Path $env:RUNNER_TEMP "MarkSoft-Code-Signing.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MARKSOFT_SIGNING_CERT_BASE64))
            $password = ConvertTo-SecureString $env:MARKSOFT_SIGNING_CERT_PASSWORD -AsPlainText -Force
            $certs = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $cert = $certs | Select-Object -First 1
            if (-not $cert) { throw "No se pudo importar el certificado MarkSoft almacenado en GitHub Secrets." }
            Export-Certificate -Cert $cert -FilePath "artifacts/MarkHotspot/MarkSoft-Code-Signing.cer" -Force | Out-Null
            & $signTool sign /fd SHA256 /f $pfx /p $env:MARKSOFT_SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw "SignTool no pudo firmar MarkHotspot.exe con el certificado persistente." }
            Write-Host "Firmado con el certificado persistente de MarkSoft."
          } else {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=MarkSoft Code Signing" -CertStoreLocation Cert:\CurrentUser\My -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(2)
            Export-Certificate -Cert $cert -FilePath "artifacts/MarkHotspot/MarkSoft-Code-Signing.cer" -Force | Out-Null
            & $signTool sign /fd SHA256 /sha1 $cert.Thumbprint /s My /tr http://timestamp.digicert.com /td SHA256 $exe
            if ($LASTEXITCODE -ne 0) { throw "SignTool no pudo firmar MarkHotspot.exe con el certificado autofirmado MarkSoft." }
            Write-Warning "Certificado autofirmado temporal: el editor se muestra como MarkSoft Code Signing, pero la identidad criptográfica cambiará en futuras compilaciones si no se configuran los secretos MARKSOFT_SIGNING_CERT_BASE64 y MARKSOFT_SIGNING_CERT_PASSWORD."
          }

          $signature = Get-AuthenticodeSignature $exe
          if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -notmatch 'CN=MarkSoft Code Signing') {
            throw "La firma no quedó aplicada con el editor esperado. Estado: $($signature.Status)"
          }
          Write-Host "Firma aplicada. Editor: $($signature.SignerCertificate.Subject); estado local: $($signature.Status)"

      - name: Upload build artifact
        if: steps.guard.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MarkHotspot-win-x64
          path: artifacts/MarkHotspot/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release with changelog
        if: steps.guard.outputs.current == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $notes = "Nuevas mejoras en estabilidad y corrección de errores"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create $tag "artifacts/MarkHotspot/MarkHotspot.exe" "artifacts/MarkHotspot/MarkSoft-Code-Signing.cer" --title $tag --notes-file release-notes.md
